<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskCal Workspace — Calendario Colaborativo de Pendientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cliente Supabase desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
  </style>
</head>
<body class="bg-[#f0f2f5] text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Barra Superior -->
  <header class="bg-white border-b border-slate-200/80 px-6 lg:px-10 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-20">
    <div class="flex items-center gap-3.5">
      <div class="w-10 h-10 rounded-xl bg-[#1e2a78] flex items-center justify-center text-white font-bold text-base shadow-xs tracking-wide">
        TC
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-tight">TaskCal Workspace</h1>
          <span id="workspaceBadge" class="hidden text-[10px] px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-semibold border border-indigo-200"></span>
        </div>
        <p class="text-xs text-slate-500 font-normal">Calendario de pendientes diarios compartible</p>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center gap-2.5">
      <button onclick="copyDaySummary()" class="px-4 py-2 text-xs font-medium text-slate-700 bg-slate-200/80 hover:bg-slate-300/80 rounded-xl transition flex items-center gap-2">
        <span>📋</span> Copiar resumen
      </button>
      <button onclick="copyWorkspaceLink()" class="px-4 py-2 text-xs font-semibold text-white bg-[#253992] hover:bg-[#1a2b75] rounded-xl shadow-xs transition flex items-center gap-2">
        <span>🔗</span> Compartir (Link)
      </button>
    </div>
  </header>

  <!-- Contenedor Principal (Split View) -->
  <main class="flex-1 max-w-[1400px] w-full mx-auto p-4 md:p-6 lg:p-7 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- Columna Izquierda: Calendario (8 cols) -->
    <section class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 shadow-sm p-6 flex flex-col">
      
      <!-- Controles de Mes -->
      <div class="flex items-center justify-between mb-5">
        <h2 id="monthYearLabel" class="text-xl md:text-2xl font-bold capitalize text-slate-900">
          Octubre 2026
        </h2>
        <div class="flex items-center gap-2">
          <div class="inline-flex items-center border border-slate-200 rounded-xl overflow-hidden bg-white shadow-2xs">
            <button onclick="changeMonth(-1)" class="px-3 py-1.5 hover:bg-slate-50 text-slate-600 transition text-xs font-semibold" title="Mes anterior">
              &lt;
            </button>
            <div class="w-px h-4 bg-slate-200"></div>
            <button onclick="changeMonth(1)" class="px-3 py-1.5 hover:bg-slate-50 text-slate-600 transition text-xs font-semibold" title="Mes siguiente">
              &gt;
            </button>
          </div>
          <button onclick="goToToday()" class="px-3.5 py-1.5 text-xs font-medium border border-slate-200 rounded-xl bg-white hover:bg-slate-50 text-slate-700 shadow-2xs transition">
            Hoy
          </button>
        </div>
      </div>

      <!-- Cabecera de Días de la Semana -->
      <div class="grid grid-cols-7 mb-2 text-center text-xs font-medium text-slate-400">
        <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
      </div>

      <!-- Cuadrícula Dinámica Unificada con Bordes Finos -->
      <div class="border border-slate-200 rounded-xl overflow-hidden bg-slate-200 gap-px grid grid-cols-7 auto-rows-fr shadow-2xs" id="calendarGrid">
      </div>
    </section>

    <!-- Columna Derecha: Agenda del Día (4 cols) -->
    <aside class="lg:col-span-4 bg-white rounded-2xl border border-slate-200 shadow-sm p-6 flex flex-col min-h-[580px]">
      
      <!-- Encabezado de la Agenda -->
      <div>
        <h3 class="text-lg md:text-xl font-bold text-slate-900">Agenda del Día</h3>
        <p id="selectedDateLabel" class="text-xs text-slate-500 font-medium capitalize mt-0.5">
          Miércoles, 14 de octubre de 2026
        </p>

        <!-- Barra de Progreso -->
        <div class="mt-4 mb-5">
          <div class="flex items-center justify-between text-xs font-semibold mb-2">
            <span class="text-slate-800">Progreso completado <span id="progressRatio" class="font-normal text-slate-500">0/0</span></span>
            <span id="progressPercent" class="font-bold text-slate-900">0%</span>
          </div>
          <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-[#1e2a78] rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <div class="w-full h-px bg-slate-100 mb-5"></div>

      <!-- Formulario para Nuevo Pendiente -->
      <form id="taskForm" onsubmit="handleFormSubmit(event)" class="space-y-2.5 mb-5">
        <input 
          type="text" 
          id="taskInput" 
          placeholder="Escribe un nuevo pendiente..." 
          required
          class="w-full text-xs bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 shadow-2xs transition"
        >
        <div class="grid grid-cols-12 gap-2">
          <div class="col-span-6 relative">
            <select id="taskCategory" class="w-full text-xs bg-white border border-slate-200 rounded-xl pl-3 pr-7 py-2 text-slate-700 focus:outline-none appearance-none cursor-pointer shadow-2xs">
              <option value="trabajo">Pendiente... ▾</option>
              <option value="trabajo">🔵 Trabajo</option>
              <option value="urgente">🔴 Urgente</option>
              <option value="personal">🟢 Personal</option>
            </select>
          </div>
          <button type="submit" id="addBtn" class="col-span-6 py-2 bg-black hover:bg-slate-800 text-white text-xs font-semibold rounded-xl transition shadow-2xs cursor-pointer">
            + Agregar Pendiente
          </button>
        </div>
      </form>

      <!-- Lista de Pendientes -->
      <div id="taskList" class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-1"></div>
    </aside>

  </main>

  <!-- Notificación Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN Y CLIENTE SUPABASE
    // ==========================================
    const SUPABASE_URL = 'https://qfteohzbcectdynesoyl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmdGVvaHpiY2VjdGR5bmVzb3lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwODQ2OTMsImV4cCI6MjEwNzY2MDY5M30.RKPuMqKX5odP_M8KtIYys1tUg9k9QrWT8P5sG1ncPuw';
    
    let supabase = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn('Supabase no inicializado, modo offline activado', e);
    }

    const LOCAL_STORAGE_KEY = 'taskcal_cached_tasks_v2';

    // Espacio de trabajo (por defecto 'general' o '?ws=equipo')
    const urlParams = new URLSearchParams(window.location.search);
    const currentWorkspace = urlParams.get('ws') || 'general';
    if (currentWorkspace !== 'general') {
      const badge = document.getElementById('workspaceBadge');
      badge.textContent = currentWorkspace;
      badge.classList.remove('hidden');
    }

    let tasksByDate = {};
    // Cargar caché local inmediato si existe
    try {
      const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (cached) tasksByDate = JSON.parse(cached);
    } catch (e) {}

    // Iniciar en Octubre 2026 (14 de octubre) para que coincida con la maqueta
    let currentDate = new Date(2026, 9, 14);
    let selectedDateKey = '2026-10-14';

    const categoryStyles = {
      urgente: { bg: 'bg-rose-50 text-rose-700 border-rose-100', dot: 'bg-rose-500', label: 'Urgente' },
      trabajo: { bg: 'bg-blue-50 text-blue-700 border-blue-100', dot: 'bg-blue-500', label: 'Trabajo' },
      personal: { bg: 'bg-emerald-50 text-emerald-700 border-emerald-100', dot: 'bg-emerald-500', label: 'Personal' }
    };

    // Generador seguro de IDs compatible con todos los navegadores
    function generateId() {
      return 'task_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 9);
    }

    function saveLocalBackup() {
      try {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(tasksByDate));
      } catch (e) {}
    }

    // ==========================================
    // 2. INICIALIZACIÓN
    // ==========================================
    async function init() {
      renderCalendar();
      renderSidePanel();
      await fetchTasks();
      setupRealtime();
    }

    async function fetchTasks() {
      if (!supabase) return;
      try {
        const { data, error } = await supabase
          .from('calendar_tasks')
          .select('*')
          .eq('workspace_slug', currentWorkspace);

        if (error) {
          console.warn('Error al leer de Supabase:', error.message);
          return;
        }

        if (data && data.length > 0) {
          tasksByDate = {};
          data.forEach(task => {
            const key = task.task_date;
            if (!tasksByDate[key]) tasksByDate[key] = [];
            tasksByDate[key].push(task);
          });
          saveLocalBackup();
          renderCalendar();
          renderSidePanel();
        }
      } catch (err) {
        console.warn('fetchTasks caught:', err);
      }
    }

    function setupRealtime() {
      if (!supabase) return;
      try {
        supabase
          .channel('public:calendar_tasks')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'calendar_tasks', filter: `workspace_slug=eq.${currentWorkspace}` },
            () => {
              fetchTasks().then(() => {
                renderCalendar();
                renderSidePanel();
              });
            }
          )
          .subscribe();
      } catch (e) {}
    }

    // ==========================================
    // 3. OPERACIONES EN LA LISTA DE TAREAS
    // ==========================================
    function handleFormSubmit(e) {
      if (e) e.preventDefault();
      addTask();
    }

    async function addTask() {
      const titleInput = document.getElementById('taskInput');
      const categoryInput = document.getElementById('taskCategory');

      let rawTitle = titleInput.value.trim();
      if (!rawTitle) return;

      let assignee = null;
      // Extrae @nombre si está escrito en el título
      const assigneeMatch = rawTitle.match(/@([a-zA-Z0-9_\u00C0-\u017F]+)/);
      if (assigneeMatch) {
        assignee = assigneeMatch[1];
        rawTitle = rawTitle.replace(assigneeMatch[0], '').trim();
      }

      let category = categoryInput.value;
      if (!categoryStyles[category]) category = 'trabajo';

      const tempId = generateId();
      const newTask = {
        id: tempId,
        workspace_slug: currentWorkspace,
        task_date: selectedDateKey,
        title: rawTitle,
        category: category,
        assignee: assignee,
        done: false
      };

      // Limpiar input de inmediato
      titleInput.value = '';

      // 1. Inserción inmediata en memoria y localStorage (instantáneo para el usuario)
      if (!tasksByDate[selectedDateKey]) tasksByDate[selectedDateKey] = [];
      tasksByDate[selectedDateKey].push(newTask);
      saveLocalBackup();

      // Renderizar al instante
      renderCalendar();
      renderSidePanel();
      showToast('✅ Pendiente agregado');

      // 2. Sincronizar en segundo plano con Supabase
      if (supabase) {
        try {
          const { data, error } = await supabase
            .from('calendar_tasks')
            .insert([{
              workspace_slug: currentWorkspace,
              task_date: selectedDateKey,
              title: rawTitle,
              category: category,
              assignee: assignee,
              done: false
            }])
            .select();

          if (error) {
            console.error('Error guardando en Supabase:', error);
          } else if (data && data[0]) {
            // Reemplazar tempId por ID real de Supabase
            const list = tasksByDate[selectedDateKey] || [];
            const idx = list.findIndex(t => t.id === tempId);
            if (idx !== -1) {
              list[idx].id = data[0].id;
              saveLocalBackup();
            }
          }
        } catch (err) {
          console.error('Error de red al guardar en Supabase:', err);
        }
      }
    }

    async function toggleTask(taskId) {
      const list = tasksByDate[selectedDateKey] || [];
      const task = list.find(t => String(t.id) === String(taskId));
      if (!task) return;

      task.done = !task.done;
      saveLocalBackup();
      renderCalendar();
      renderSidePanel();

      if (supabase) {
        try {
          await supabase
            .from('calendar_tasks')
            .update({ done: task.done })
            .eq('id', taskId);
        } catch (e) {
          console.error('Error al actualizar en Supabase:', e);
        }
      }
    }

    async function deleteTask(taskId) {
      const list = tasksByDate[selectedDateKey] || [];
      tasksByDate[selectedDateKey] = list.filter(t => String(t.id) !== String(taskId));
      if (tasksByDate[selectedDateKey].length === 0) delete tasksByDate[selectedDateKey];
      
      saveLocalBackup();
      renderCalendar();
      renderSidePanel();
      showToast('🗑️ Tarea eliminada');

      if (supabase) {
        try {
          await supabase
            .from('calendar_tasks')
            .delete()
            .eq('id', taskId);
        } catch (e) {
          console.error('Error al borrar en Supabase:', e);
        }
      }
    }

    // ==========================================
    // 4. RENDERIZADO DEL CALENDARIO
    // ==========================================
    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      selectedDateKey = formatDateKey(currentDate);
      renderCalendar();
      renderSidePanel();
    }

    function selectDate(dateKey) {
      selectedDateKey = dateKey;
      renderCalendar();
      renderSidePanel();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const monthYearLabel = document.getElementById('monthYearLabel');
      grid.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthYearLabel.textContent = new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(currentDate);

      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);
      
      // Ajustar para que la semana empiece en Lunes (0 = Lun, 6 = Dom)
      let startDay = (firstDayOfMonth.getDay() + 6) % 7;
      const totalDays = lastDayOfMonth.getDate();

      // Días del mes anterior
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startDay - 1; i >= 0; i--) {
        const prevDayNum = prevMonthLastDay - i;
        const prevDate = new Date(year, month - 1, prevDayNum);
        const dateKey = formatDateKey(prevDate);
        grid.appendChild(createCell(dateKey, prevDayNum, true));
      }

      // Días del mes actual
      for (let day = 1; day <= totalDays; day++) {
        const cellDate = new Date(year, month, day);
        const dateKey = formatDateKey(cellDate);
        grid.appendChild(createCell(dateKey, day, false));
      }

      // Días del mes siguiente (para completar la cuadrícula de múltiplos de 7)
      const totalCellsRendered = startDay + totalDays;
      const remainingCells = (7 - (totalCellsRendered % 7)) % 7;
      for (let day = 1; day <= remainingCells; day++) {
        const nextDate = new Date(year, month + 1, day);
        const dateKey = formatDateKey(nextDate);
        grid.appendChild(createCell(dateKey, day, true));
      }
    }

    function createCell(dateKey, dayNumber, isOtherMonth) {
      const dayTasks = tasksByDate[dateKey] || [];
      const isSelected = dateKey === selectedDateKey;
      const doneCount = dayTasks.filter(t => t.done).length;

      const cell = document.createElement('div');
      cell.onclick = () => selectDate(dateKey);
      
      // Clases exactas del diseño de la maqueta
      cell.className = `min-h-[92px] p-2.5 flex flex-col justify-between cursor-pointer transition relative group ${
        isSelected
          ? 'ring-2 ring-indigo-500 bg-indigo-50/50 rounded-xl z-10'
          : isOtherMonth 
            ? 'bg-slate-50/50 text-slate-300 hover:bg-slate-100/50' 
            : 'bg-white hover:bg-slate-50/80 text-slate-800'
      }`;

      // Cabecera de la celda: Número de día
      const topRow = document.createElement('div');
      topRow.className = 'flex items-center justify-between';
      topRow.innerHTML = `
        <span class="text-xs font-semibold ${isOtherMonth ? 'text-slate-300' : 'text-slate-700'}">${dayNumber}</span>
      `;

      // Contenedor de píldoras de tareas
      const pillsContainer = document.createElement('div');
      pillsContainer.className = 'space-y-1 my-1 overflow-hidden';

      dayTasks.slice(0, 2).forEach(task => {
        const style = categoryStyles[task.category] || categoryStyles.trabajo;
        const pill = document.createElement('div');
        pill.className = `text-[10px] font-medium px-2 py-0.5 rounded-md flex items-center gap-1.5 leading-tight truncate border ${style.bg} ${task.done ? 'line-through opacity-50' : ''}`;
        pill.innerHTML = `
          <span class="w-1.5 h-1.5 rounded-full ${style.dot} shrink-0"></span>
          <span class="truncate">${task.title}</span>
        `;
        pillsContainer.appendChild(pill);
      });

      // Indicador inferior: si hay tareas completadas o más tareas
      const bottomRow = document.createElement('div');
      bottomRow.className = 'min-h-[14px] flex items-center justify-between text-[10px] text-slate-400 font-medium';

      if (dayTasks.length > 2) {
        bottomRow.innerHTML = `<span>+${dayTasks.length - 2} más</span>`;
      } else if (dayTasks.length > 0 && doneCount > 0) {
        bottomRow.innerHTML = `<span class="flex items-center gap-1 text-slate-400"><span>🕒</span> ${doneCount}/${dayTasks.length}</span>`;
      }

      cell.appendChild(topRow);
      cell.appendChild(pillsContainer);
      cell.appendChild(bottomRow);
      return cell;
    }

    // ==========================================
    // 5. RENDERIZADO DEL PANEL DERECHO (AGENDA)
    // ==========================================
    function renderSidePanel() {
      const [y, m, d] = selectedDateKey.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      
      document.getElementById('selectedDateLabel').textContent = new Intl.DateTimeFormat('es-ES', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }).format(dateObj);

      const list = document.getElementById('taskList');
      list.innerHTML = '';

      const dayTasks = tasksByDate[selectedDateKey] || [];
      const doneCount = dayTasks.filter(t => t.done).length;

      // Actualizar Barra de Progreso
      document.getElementById('progressRatio').textContent = `${doneCount}/${dayTasks.length}`;
      const percent = dayTasks.length ? Math.round((doneCount / dayTasks.length) * 100) : 0;
      document.getElementById('progressPercent').textContent = `${percent}%`;
      document.getElementById('progressBar').style.width = `${percent}%`;

      if (dayTasks.length === 0) {
        list.innerHTML = `
          <div class="text-center py-16 text-slate-400 text-xs">
            No hay pendientes registrados para este día.
          </div>
        `;
        return;
      }

      dayTasks.forEach(task => {
        const style = categoryStyles[task.category] || categoryStyles.trabajo;
        const item = document.createElement('div');
        item.className = 'flex items-start justify-between group py-2 border-b border-slate-100 last:border-0';

        item.innerHTML = `
          <label class="flex items-start gap-3 cursor-pointer flex-1 select-none">
            <div class="mt-0.5">
              <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask('${task.id}')" class="w-4 h-4 rounded border-slate-300 text-indigo-700 focus:ring-indigo-500 cursor-pointer">
            </div>
            <div class="flex-1">
              <p class="text-xs font-medium text-slate-800 leading-snug ${task.done ? 'line-through text-slate-400' : ''}">${task.title}</p>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="text-[10px] px-2 py-0.5 rounded-md font-medium border ${style.bg}">${style.label}</span>
                ${task.assignee ? `<span class="text-[10px] text-slate-500 flex items-center gap-1 font-normal">👤 ${task.assignee}</span>` : ''}
              </div>
            </div>
          </label>
          <button onclick="deleteTask('${task.id}')" class="text-slate-300 hover:text-rose-600 text-sm px-1.5 transition leading-none cursor-pointer" title="Eliminar">✕</button>
        `;
        list.appendChild(item);
      });
    }

    // ==========================================
    // 6. ACCIONES COMPARTIR
    // ==========================================
    function copyWorkspaceLink() {
      const url = `${window.location.origin}${window.location.pathname}?ws=${currentWorkspace}`;
      navigator.clipboard.writeText(url);
      showToast('🔗 Enlace al calendario copiado al portapapeles');
    }

    function copyDaySummary() {
      const dayTasks = tasksByDate[selectedDateKey] || [];
      if (dayTasks.length === 0) {
        showToast('⚠️ No hay pendientes en este día.');
        return;
      }
      const lines = dayTasks.map(t => `${t.done ? '✅' : '⬜'} ${t.title} ${t.assignee ? `(@${t.assignee})` : ''}`);
      const summary = `📅 *Pendientes del ${selectedDateKey}*\n` + lines.join('\n');
      navigator.clipboard.writeText(summary);
      showToast('📋 Resumen copiado para WhatsApp / Slack');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 3000);
    }

    // Arrancar la aplicación
    init();
  </script>
</body>
</html>
