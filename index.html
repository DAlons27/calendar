<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskCal — Calendario Colaborativo en Tiempo Real</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cliente Supabase desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Modal de Configuración Supabase si no están puestas las llaves -->
  <div id="configModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200">
      <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold mb-3">⚡</div>
      <h3 class="text-lg font-bold text-slate-900 mb-1">Configura tu conexión a Supabase</h3>
      <p class="text-xs text-slate-500 mb-4">Ingresa tu URL y clave anónima de tu proyecto Supabase para sincronizar en tiempo real.</p>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Project URL</label>
          <input id="cfgUrl" type="url" placeholder="https://xyzcompany.supabase.co" class="w-full text-xs border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Anon Public Key</label>
          <input id="cfgKey" type="text" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." class="w-full text-xs border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button onclick="saveManualConfig()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-lg transition mt-2">
          Guardar y Conectar
        </button>
      </div>
    </div>
  </div>

  <!-- Barra Superior -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-sm">
        TC
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-bold tracking-tight text-slate-900">TaskCal Workspace</h1>
          <span id="workspaceBadge" class="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-semibold border border-indigo-200"></span>
        </div>
        <p class="text-xs text-slate-500">Sincronizado en tiempo real</p>
      </div>
    </div>

    <!-- Acciones -->
    <div class="flex items-center gap-2">
      <button onclick="openConfigModal()" title="Configuración de conexión" class="p-2 text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 rounded-lg transition text-xs">
        ⚙️
      </button>
      <button onclick="copyDaySummary()" class="px-3.5 py-2 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition flex items-center gap-1.5">
        <span>📋</span> Copiar día
      </button>
      <button onclick="copyWorkspaceLink()" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition flex items-center gap-1.5">
        <span>🔗</span> Invitar al espacio
      </button>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Columna Izquierda: Calendario -->
    <section class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <h2 id="monthYearLabel" class="text-xl font-bold capitalize text-slate-900"></h2>
          <button onclick="goToToday()" class="text-xs font-medium px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
            Hoy
          </button>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="changeMonth(-1)" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition">◀</button>
          <button onclick="changeMonth(1)" class="p-2 rounded-lg hover:bg-slate-100 text-slate-600 transition">▶</button>
        </div>
      </div>

      <!-- Cabecera de Días -->
      <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
        <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
      </div>

      <!-- Cuadrícula Dinámica -->
      <div id="calendarGrid" class="grid grid-cols-7 gap-2 flex-1 auto-rows-fr"></div>
    </section>

    <!-- Columna Derecha: Panel del Día -->
    <aside class="lg:col-span-4 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col h-[640px]">
      <div class="border-b border-slate-100 pb-4 mb-4">
        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600">Agenda del Día</span>
        <h3 id="selectedDateLabel" class="text-lg font-bold text-slate-900 capitalize mt-0.5"></h3>
        
        <!-- Barra de Progreso -->
        <div class="mt-3">
          <div class="flex justify-between text-xs text-slate-500 mb-1">
            <span>Progreso completado</span>
            <span id="progressText" class="font-semibold text-slate-700">0/0</span>
          </div>
          <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- Formulario -->
      <form id="taskForm" onsubmit="addTask(event)" class="space-y-3 mb-4 bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
        <input 
          type="text" 
          id="taskInput" 
          placeholder="Escribe un nuevo pendiente..." 
          required
          class="w-full text-sm bg-white border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
        <div class="grid grid-cols-2 gap-2">
          <select id="taskCategory" class="text-xs bg-white border border-slate-200 rounded-lg px-2.5 py-2 text-slate-700 focus:outline-none">
            <option value="urgente">🔴 Urgente</option>
            <option value="trabajo" selected>🔵 Trabajo</option>
            <option value="personal">🟢 Personal</option>
          </select>
          <input 
            type="text" 
            id="taskAssignee" 
            placeholder="Asignado a (ej. Ana)" 
            class="text-xs bg-white border border-slate-200 rounded-lg px-2.5 py-2 focus:outline-none"
          >
        </div>
        <button type="submit" id="submitBtn" class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-lg transition">
          + Agregar Pendiente
        </button>
      </form>

      <!-- Lista de Tareas -->
      <div id="taskList" class="flex-1 overflow-y-auto custom-scroll space-y-2 pr-1"></div>
    </aside>

  </main>

  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN DE SUPABASE
    // ==========================================
    // Reemplaza estos valores por los de tu proyecto de Supabase
    let SUPABASE_URL = window.ENV_SUPABASE_URL || localStorage.getItem('taskcal_supabase_url') || '';
    let SUPABASE_ANON_KEY = window.ENV_SUPABASE_KEY || localStorage.getItem('taskcal_supabase_key') || '';

    let supabase = null;

    function initSupabaseClient() {
      if (SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_URL.startsWith('http')) {
        try {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          return true;
        } catch (e) {
          console.error('Error inicializando Supabase', e);
          return false;
        }
      }
      return false;
    }

    // Identificar el espacio de trabajo desde la URL (?ws=equipo-marketing o 'general')
    const urlParams = new URLSearchParams(window.location.search);
    const currentWorkspace = urlParams.get('ws') || 'general';
    document.getElementById('workspaceBadge').textContent = `Espacio: ${currentWorkspace}`;

    let tasksByDate = {};
    let currentDate = new Date();
    let selectedDateKey = formatDateKey(new Date());

    const categoryStyles = {
      urgente: { bg: 'bg-rose-50 text-rose-700 border-rose-200', dot: 'bg-rose-500', label: 'Urgente' },
      trabajo: { bg: 'bg-indigo-50 text-indigo-700 border-indigo-200', dot: 'bg-indigo-500', label: 'Trabajo' },
      personal: { bg: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500', label: 'Personal' }
    };

    // ==========================================
    // 2. INICIALIZACIÓN Y TIEMPO REAL
    // ==========================================
    async function init() {
      if (!initSupabaseClient()) {
        openConfigModal();
        renderCalendar();
        renderSidePanel();
        return;
      }

      await fetchTasks();
      renderCalendar();
      renderSidePanel();
      setupRealtime();
    }

    async function fetchTasks() {
      if (!supabase) return;
      const { data, error } = await supabase
        .from('calendar_tasks')
        .select('*')
        .eq('workspace_slug', currentWorkspace);

      if (error) {
        console.error('Error al cargar tareas:', error);
        showToast('❌ Error de conexión con Supabase');
        return;
      }

      tasksByDate = {};
      data.forEach(task => {
        const key = task.task_date;
        if (!tasksByDate[key]) tasksByDate[key] = [];
        tasksByDate[key].push(task);
      });
    }

    function setupRealtime() {
      if (!supabase) return;
      supabase
        .channel('public:calendar_tasks')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'calendar_tasks', filter: `workspace_slug=eq.${currentWorkspace}` },
          () => {
            fetchTasks().then(() => {
              renderCalendar();
              renderSidePanel();
            });
          }
        )
        .subscribe();
    }

    // ==========================================
    // 3. OPERACIONES EN SUPABASE
    // ==========================================
    async function addTask(e) {
      e.preventDefault();
      if (!supabase) {
        openConfigModal();
        return;
      }

      const titleInput = document.getElementById('taskInput');
      const categoryInput = document.getElementById('taskCategory');
      const assigneeInput = document.getElementById('taskAssignee');

      const newTask = {
        workspace_slug: currentWorkspace,
        task_date: selectedDateKey,
        title: titleInput.value.trim(),
        category: categoryInput.value,
        assignee: assigneeInput.value.trim() || null,
        done: false
      };

      titleInput.value = '';

      const { data, error } = await supabase
        .from('calendar_tasks')
        .insert([newTask])
        .select();

      if (error) {
        showToast('❌ No se pudo guardar la tarea');
        return;
      }

      if (!tasksByDate[selectedDateKey]) tasksByDate[selectedDateKey] = [];
      tasksByDate[selectedDateKey].push(data[0]);

      renderCalendar();
      renderSidePanel();
      showToast('✅ Pendiente agregado');
    }

    async function toggleTask(taskId) {
      if (!supabase) return;
      const list = tasksByDate[selectedDateKey] || [];
      const task = list.find(t => t.id === taskId);
      if (!task) return;

      const newDone = !task.done;
      task.done = newDone;
      renderCalendar();
      renderSidePanel();

      const { error } = await supabase
        .from('calendar_tasks')
        .update({ done: newDone })
        .eq('id', taskId);

      if (error) {
        showToast('❌ Error al actualizar tarea');
        task.done = !newDone;
        renderCalendar();
        renderSidePanel();
      }
    }

    async function deleteTask(taskId) {
      if (!supabase) return;
      tasksByDate[selectedDateKey] = (tasksByDate[selectedDateKey] || []).filter(t => t.id !== taskId);
      if (tasksByDate[selectedDateKey].length === 0) delete tasksByDate[selectedDateKey];
      renderCalendar();
      renderSidePanel();

      const { error } = await supabase
        .from('calendar_tasks')
        .delete()
        .eq('id', taskId);

      if (error) {
        showToast('❌ Error al eliminar la tarea');
        fetchTasks().then(() => { renderCalendar(); renderSidePanel(); });
      } else {
        showToast('🗑️ Tarea eliminada');
      }
    }

    // ==========================================
    // 4. RENDERIZADO DEL CALENDARIO
    // ==========================================
    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      selectedDateKey = formatDateKey(currentDate);
      renderCalendar();
      renderSidePanel();
    }

    function selectDate(dateKey) {
      selectedDateKey = dateKey;
      renderCalendar();
      renderSidePanel();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const monthYearLabel = document.getElementById('monthYearLabel');
      grid.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthYearLabel.textContent = new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(currentDate);

      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);
      
      let startDay = (firstDayOfMonth.getDay() + 6) % 7;
      const totalDays = lastDayOfMonth.getDate();
      const todayKey = formatDateKey(new Date());

      for (let i = 0; i < startDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'bg-slate-50/60 rounded-xl border border-transparent min-h-[95px]';
        grid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const cellDate = new Date(year, month, day);
        const dateKey = formatDateKey(cellDate);
        const dayTasks = tasksByDate[dateKey] || [];
        const isSelected = dateKey === selectedDateKey;
        const isToday = dateKey === todayKey;

        const cell = document.createElement('div');
        cell.onclick = () => selectDate(dateKey);
        cell.className = `min-h-[95px] p-2 rounded-xl border transition cursor-pointer flex flex-col justify-between ${
          isSelected 
            ? 'border-indigo-600 ring-2 ring-indigo-500/20 bg-indigo-50/20' 
            : 'border-slate-200/80 hover:border-slate-300 bg-white'
        }`;

        const topRow = document.createElement('div');
        topRow.className = 'flex items-center justify-between';
        topRow.innerHTML = `
          <span class="text-xs font-semibold w-6 h-6 flex items-center justify-center rounded-full ${
            isToday ? 'bg-indigo-600 text-white' : 'text-slate-700'
          }">${day}</span>
          ${dayTasks.length > 0 ? `<span class="text-[10px] font-medium text-slate-400">${dayTasks.filter(t=>t.done).length}/${dayTasks.length}</span>` : ''}
        `;

        const pillsContainer = document.createElement('div');
        pillsContainer.className = 'space-y-1 mt-1 overflow-hidden';

        dayTasks.slice(0, 2).forEach(task => {
          const style = categoryStyles[task.category] || categoryStyles.trabajo;
          const pill = document.createElement('div');
          pill.className = `text-[10px] px-1.5 py-0.5 rounded truncate border ${style.bg} ${task.done ? 'line-through opacity-50' : ''}`;
          pill.textContent = task.title;
          pillsContainer.appendChild(pill);
        });

        if (dayTasks.length > 2) {
          const more = document.createElement('div');
          more.className = 'text-[10px] text-slate-400 font-medium pl-1';
          more.textContent = `+${dayTasks.length - 2} más`;
          pillsContainer.appendChild(more);
        }

        cell.appendChild(topRow);
        cell.appendChild(pillsContainer);
        grid.appendChild(cell);
      }
    }

    function renderSidePanel() {
      const [y, m, d] = selectedDateKey.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      document.getElementById('selectedDateLabel').textContent = new Intl.DateTimeFormat('es-ES', {
        weekday: 'long', day: 'numeric', month: 'long'
      }).format(dateObj);

      const list = document.getElementById('taskList');
      list.innerHTML = '';

      const dayTasks = tasksByDate[selectedDateKey] || [];
      const doneCount = dayTasks.filter(t => t.done).length;

      document.getElementById('progressText').textContent = `${doneCount}/${dayTasks.length}`;
      const percent = dayTasks.length ? Math.round((doneCount / dayTasks.length) * 100) : 0;
      document.getElementById('progressBar').style.width = `${percent}%`;

      if (dayTasks.length === 0) {
        list.innerHTML = `
          <div class="text-center py-12 text-slate-400 text-xs">
            No hay pendientes registrados para este día.
          </div>
        `;
        return;
      }

      dayTasks.forEach(task => {
        const style = categoryStyles[task.category] || categoryStyles.trabajo;
        const item = document.createElement('div');
        item.className = `p-3 rounded-xl border transition flex items-start justify-between gap-2 ${
          task.done ? 'bg-slate-50 border-slate-200/60 opacity-60' : 'bg-white border-slate-200 shadow-2xs'
        }`;

        item.innerHTML = `
          <label class="flex items-start gap-2.5 cursor-pointer flex-1">
            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask('${task.id}')" class="mt-1 rounded text-indigo-600 focus:ring-indigo-500">
            <div class="flex-1">
              <p class="text-xs font-medium text-slate-800 ${task.done ? 'line-through' : ''}">${task.title}</p>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="text-[10px] px-2 py-0.5 rounded-full border font-medium ${style.bg}">${style.label}</span>
                ${task.assignee ? `<span class="text-[10px] text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">👤 ${task.assignee}</span>` : ''}
              </div>
            </div>
          </label>
          <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-rose-600 text-xs px-1" title="Eliminar">✕</button>
        `;
        list.appendChild(item);
      });
    }

    function copyWorkspaceLink() {
      const url = `${window.location.origin}${window.location.pathname}?ws=${currentWorkspace}`;
      navigator.clipboard.writeText(url);
      showToast('🔗 Enlace copiado. ¡Compártelo con tu equipo!');
    }

    function copyDaySummary() {
      const dayTasks = tasksByDate[selectedDateKey] || [];
      if (dayTasks.length === 0) {
        showToast('⚠️ No hay pendientes en este día.');
        return;
      }
      const lines = dayTasks.map(t => `${t.done ? '✅' : '⬜'} ${t.title} ${t.assignee ? `(@${t.assignee})` : ''}`);
      const summary = `📅 *Pendientes del ${selectedDateKey}*\n` + lines.join('\n');
      navigator.clipboard.writeText(summary);
      showToast('📋 Resumen copiado al portapapeles.');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 3000);
    }

    function openConfigModal() {
      document.getElementById('cfgUrl').value = SUPABASE_URL;
      document.getElementById('cfgKey').value = SUPABASE_ANON_KEY;
      document.getElementById('configModal').classList.remove('hidden');
    }

    function saveManualConfig() {
      const url = document.getElementById('cfgUrl').value.trim();
      const key = document.getElementById('cfgKey').value.trim();
      if (!url || !key) {
        alert('Por favor ingresa ambos valores');
        return;
      }
      localStorage.setItem('taskcal_supabase_url', url);
      localStorage.setItem('taskcal_supabase_key', key);
      SUPABASE_URL = url;
      SUPABASE_ANON_KEY = key;
      document.getElementById('configModal').classList.add('hidden');
      init();
    }

    init();
  </script>
</body>
</html>
